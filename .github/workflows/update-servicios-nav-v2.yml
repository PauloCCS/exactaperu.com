name: Update Servicios navigation v2
on:
  push:
    branches: [update-servicios-nav]
permissions:
  contents: write
jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-servicios-nav
      - name: Add Servicios to existing navigation
        shell: python
        run: |
          from pathlib import Path
          import re
          changed=[]
          for p in Path(".").rglob("*.html"):
              s=p.read_text(encoding="utf-8")
              if "<nav" not in s or "Soluciones</a>" not in s:
                  continue
              navs=list(re.finditer(r"<nav\b[\s\S]*?</nav>",s,re.I))
              out=s
              offset=0
              touched=False
              for m in navs:
                  nav=m.group(0)
                  if "servicios.html" in nav.lower():
                      continue
                  sol=re.search(r'(<a\s+href="([^"]*index\.html)?#soluciones"[^>]*>Soluciones</a>)',nav,re.I)
                  if not sol:
                      continue
                  href=sol.group(2) or ""
                  service_href=href.replace("index.html","servicios.html") if href else "servicios.html"
                  newnav=nav[:sol.end()] + f'<a href="{service_href}">Servicios</a>' + nav[sol.end():]
                  a=m.start()+offset; b=m.end()+offset
                  out=out[:a]+newnav+out[b:]
                  offset += len(newnav)-len(nav)
                  touched=True
              if touched and out!=s:
                  p.write_text(out,encoding="utf-8")
                  changed.append(str(p))
          Path("nav-update-report.txt").write_text("\n".join(changed),encoding="utf-8")
      - name: Cleanup and commit
        shell: bash
        run: |
          rm -f .github/workflows/update-servicios-nav-v2.yml .nav-trigger
          git config user.name "PauloCCS"
          git config user.email "contacto@exactaperu.com"
          git add -A
          git commit -m "Add Servicios to navigation across site" || exit 0
          git push origin update-servicios-nav
